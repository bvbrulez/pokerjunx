<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monatliche Übersicht der erzeugten Energie des Balkonkraftwerks."
    />
    <title>Balkonkraftwerk – Ertrag</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #17324d;
        background: #eef6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        background: #176b87;
        color: white;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1,
      h2 {
        margin-top: 0;
      }

      header h1 {
        margin-bottom: 0.5rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        margin: 0 auto;
        max-width: 48rem;
        padding: 2rem 1rem;
      }

      section {
        background: white;
        border: 1px solid #d2e2eb;
        border-radius: 0.75rem;
        box-shadow: 0 0.25rem 1rem rgb(23 50 77 / 8%);
        padding: 1.5rem;
      }

      .summary-grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(2, 1fr);
      }

      .summary-card {
        background: #eef6fb;
        border-radius: 0.5rem;
        padding: 1rem;
      }

      .summary-card strong {
        display: block;
        font-size: 1.5rem;
      }

      form {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(3, 1fr);
      }

      label {
        display: grid;
        font-weight: 600;
        gap: 0.35rem;
      }

      input,
      select,
      button {
        border: 1px solid #9bb8c7;
        border-radius: 0.4rem;
        font: inherit;
        min-height: 2.7rem;
        padding: 0.45rem 0.65rem;
      }

      button {
        align-self: end;
        background: #176b87;
        border-color: #176b87;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover,
      button:focus-visible {
        background: #0f4e64;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      caption {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        text-align: left;
      }

      th,
      td {
        border-bottom: 1px solid #d2e2eb;
        padding: 0.65rem 0.4rem;
        text-align: left;
      }

      th:last-child,
      td:last-child {
        text-align: right;
      }

      tfoot td {
        border-bottom: 0;
        font-weight: 700;
      }

      .empty {
        color: #60798a;
      }

      .status {
        min-height: 1.5rem;
      }

      @media (max-width: 42rem) {
        form {
          grid-template-columns: 1fr;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Balkonkraftwerk</h1>
      <p>Monatliche Übersicht der erzeugten Energie</p>
    </header>

    <main>
      <section aria-labelledby="entry-heading">
        <h2 id="entry-heading">Kilowattstunden eintragen</h2>
        <form id="energy-form">
          <label for="month">
            Monat
            <select id="month" name="month" required>
              <option value="1">Januar</option>
              <option value="2">Februar</option>
              <option value="3">März</option>
              <option value="4">April</option>
              <option value="5">Mai</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Dezember</option>
            </select>
          </label>
          <label for="year">
            Jahr
            <input id="year" name="year" type="number" min="2000" max="2100" required />
          </label>
          <label for="kilowatt-hours">
            Ertrag (kWh)
            <input
              id="kilowatt-hours"
              name="kilowatt-hours"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
              required
            />
          </label>
          <button type="submit">Speichern</button>
        </form>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="overview-heading">
        <h2 id="overview-heading">Monatsübersicht</h2>
        <label for="display-year">
          Angezeigtes Jahr
          <select id="display-year"></select>
        </label>
        <table>
          <caption id="table-caption">Ertrag im Jahr</caption>
          <thead>
            <tr>
              <th scope="col">Monat</th>
              <th scope="col">Erreicht</th>
            </tr>
          </thead>
          <tbody id="overview"></tbody>
          <tfoot>
            <tr>
              <td>Jahressumme</td>
              <td id="year-total">0,00 kWh</td>
            </tr>
          </tfoot>
        </table>
      </section>

      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Gesamtertrag</h2>
        <div class="summary-grid">
          <div class="summary-card">
            <span>Gesamtwert aller Jahre</span>
            <strong id="all-time-total">0,00 kWh</strong>
          </div>
          <div class="summary-card">
            <span>Jahreswert <span id="summary-year"></span></span>
            <strong id="summary-year-total">0,00 kWh</strong>
          </div>
        </div>
        <table>
          <caption>Ertrag je Jahr</caption>
          <thead>
            <tr>
              <th scope="col">Jahr</th>
              <th scope="col">Jahreswert</th>
            </tr>
          </thead>
          <tbody id="annual-overview"></tbody>
        </table>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "balkonkraftwerk-ertraege";
      const monthNames = [
        "Januar",
        "Februar",
        "März",
        "April",
        "Mai",
        "Juni",
        "Juli",
        "August",
        "September",
        "Oktober",
        "November",
        "Dezember",
      ];
      const now = new Date();
      const form = document.querySelector("#energy-form");
      const yearInput = document.querySelector("#year");
      const monthInput = document.querySelector("#month");
      const hoursInput = document.querySelector("#kilowatt-hours");
      const displayYear = document.querySelector("#display-year");
      const overview = document.querySelector("#overview");
      const yearTotal = document.querySelector("#year-total");
      const tableCaption = document.querySelector("#table-caption");
      const allTimeTotal = document.querySelector("#all-time-total");
      const summaryYear = document.querySelector("#summary-year");
      const summaryYearTotal = document.querySelector("#summary-year-total");
      const annualOverview = document.querySelector("#annual-overview");
      const status = document.querySelector("#status");

      function loadEntries() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function formatEnergy(value) {
        return `${value.toLocaleString("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })} kWh`;
      }

      function renderYears(entries) {
        const years = new Set([String(now.getFullYear()), ...Object.keys(entries).map((key) => key.slice(0, 4))]);
        const selectedYear = displayYear.value || String(now.getFullYear());
        displayYear.replaceChildren(
          ...[...years]
            .sort()
            .reverse()
            .map((year) => new Option(year, year, year === selectedYear, year === selectedYear)),
        );
      }

      function render() {
        const entries = loadEntries();
        renderYears(entries);
        const selectedYear = displayYear.value;
        const annualTotals = {};
        Object.entries(entries).forEach(([key, value]) => {
          const year = key.slice(0, 4);
          if (typeof value === "number" && Number.isFinite(value)) {
            annualTotals[year] = (annualTotals[year] || 0) + value;
          }
        });
        let total = 0;
        overview.replaceChildren(
          ...monthNames.map((name, index) => {
            const value = entries[`${selectedYear}-${String(index + 1).padStart(2, "0")}`];
            const numericValue = typeof value === "number" ? value : 0;
            total += numericValue;
            const row = document.createElement("tr");
            row.innerHTML = `<td>${name}</td><td class="${numericValue === 0 ? "empty" : ""}">${numericValue === 0 ? "Noch nicht eingetragen" : formatEnergy(numericValue)}</td>`;
            return row;
          }),
        );
        tableCaption.textContent = `Ertrag im Jahr ${selectedYear}`;
        yearTotal.textContent = formatEnergy(total);
        allTimeTotal.textContent = formatEnergy(
          Object.values(annualTotals).reduce((sum, value) => sum + value, 0),
        );
        summaryYear.textContent = selectedYear;
        summaryYearTotal.textContent = formatEnergy(annualTotals[selectedYear] || 0);
        annualTotals[selectedYear] = annualTotals[selectedYear] || 0;
        annualOverview.replaceChildren(
          ...Object.keys(annualTotals)
            .sort()
            .reverse()
            .map((year) => {
              const row = document.createElement("tr");
              row.innerHTML = `<td>${year}</td><td>${formatEnergy(annualTotals[year])}</td>`;
              return row;
            }),
        );
      }

      yearInput.value = now.getFullYear();
      displayYear.addEventListener("change", render);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const year = Number(yearInput.value);
        const month = Number(monthInput.value);
        const value = Number(hoursInput.value);
        if (!Number.isInteger(year) || year < 2000 || year > 2100 || !Number.isFinite(value) || value < 0) {
          status.textContent = "Bitte gültige Werte eingeben.";
          return;
        }
        const entries = loadEntries();
        entries[`${year}-${String(month).padStart(2, "0")}`] = value;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        displayYear.value = String(year);
        render();
        status.textContent = `${monthNames[month - 1]} ${year} wurde gespeichert.`;
        hoursInput.value = "";
      });

      render();
    </script>
  </body>
</html>
